<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зона Зодиака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d9e2d6;--panel:#f8f6f0;--ink:#24221d;--muted:#5f5c53;--line:#c9c4b4;--soft:#ece8dc;--sky:#2d4a3f;
  --btn:#2a2925;--btnInk:#f8f6f0;
  --wood:#7b4a25;--wood2:#8f5a2f;--birch:#f0ddb2;--burn:#5b3419;
  --p0:#c8372d;--p1:#2f8a4a;--p2:#e0a21a;--p3:#2d5ca8;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121917;--panel:#1f2725;--ink:#ece8de;--muted:#a6a297;--line:#36403d;--soft:#2a3431;--sky:#f3e7c4;--btn:#ece8de;--btnInk:#1a201e;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121917;--panel:#1f2725;--ink:#ece8de;--muted:#a6a297;--line:#36403d;--soft:#2a3431;--sky:#f3e7c4;--btn:#ece8de;--btnInk:#1a201e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
[hidden]{display:none!important}
.screen{display:none}.screen.on{display:block}

.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto;padding:12px 16px 0}
.brand{font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em}
.gctl{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.ib:hover{border-color:var(--ink)}
.ib[aria-pressed="false"]{opacity:.55}
.ib.live{background:#c8372d;color:#fff;border-color:#c8372d}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.btn{background:var(--btn);color:var(--btnInk);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:14px 20px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--p0);border:1px solid var(--p0)}
.in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit}
.fld{display:grid;gap:6px;margin:14px 0}
.fld span{font-size:14px;color:var(--muted)}
.lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
.err{color:var(--p0);font-size:14px;min-height:20px;margin:8px 0 0}

/* home */
.homeScr{max-width:1100px;margin:0 auto;padding:24px 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;min-height:calc(100vh - 70px)}
.ringWrap{display:grid;place-items:center}
.ring{position:relative;width:min(420px,78vw);aspect-ratio:1;animation:rot 80s linear infinite}
.ring img{position:absolute;width:15%;aspect-ratio:1;object-fit:contain;background:#fffaf0;border-radius:50%;padding:1.2%;box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translate(-50%,-50%);animation:rot 80s linear infinite reverse}
.ring .core{position:absolute;inset:30%;border-radius:50%;background:conic-gradient(from -45deg,var(--p1) 0 90deg,var(--p2) 0 180deg,var(--p3) 0 270deg,var(--p0) 0 360deg);box-shadow:inset 0 0 0 10px rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.25);display:grid;place-items:center}
.ring .core span{width:46%;aspect-ratio:1;border-radius:50%;background:var(--birch);display:grid;place-items:center;font-size:clamp(22px,5vw,40px);color:var(--burn)}
@keyframes rot{to{transform:rotate(360deg)}}
.ring img{animation-name:rotBack}
@keyframes rotBack{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(-360deg)}}
.homeCard h1{font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1;margin:0;letter-spacing:-.02em}
.stack{display:grid;gap:10px;margin-top:6px}

/* lobby */
.lobby{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.lobby>div{min-width:0}
.lobby h2{font-family:Unbounded,Rubik,sans-serif;font-weight:600;font-size:20px;margin:0 0 4px}
.lobby h3{font-family:Unbounded,Rubik,sans-serif;font-weight:600;font-size:15px;margin:18px 0 8px}
.seatRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seatRow .dot{width:16px;height:16px;border-radius:50%;flex:none}
.seatRow .who{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.st.on{border-color:#2f8a4a;color:#2f8a4a}.st.off{border-color:var(--p0);color:var(--p0)}
.pref{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnInk)}
.x{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;color:var(--p0)}
.linkBox{display:flex;gap:8px}
.linkBox input{flex:1;min-width:0}
.knock{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:#fff3c4;color:#3a2f00;margin-top:8px;flex-wrap:wrap}
.knock b{margin-right:auto}
.els{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.elb{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left}
.elb:hover{border-color:var(--ink)}
.elb[aria-pressed="true"]{border-color:var(--p2);box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 35%,transparent)}
.elb b{font-family:Unbounded,Rubik,sans-serif;font-weight:600;display:block;margin-bottom:6px;font-size:14px}
.elb .ics{display:flex;gap:4px}
.elb .ics img{width:34px;height:34px;object-fit:contain;background:#fffaf0;border-radius:50%;padding:2px}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:14px}
.wait i{width:10px;height:10px;border-radius:50%;background:var(--p2);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* game */
.app{max-width:1200px;margin:0 auto;padding:10px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px 24px;align-items:start}
.chips{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip.awake{border-color:var(--p2)}
.boardCol{min-width:0}
.boardWrap{position:relative;width:100%;max-width:min(760px,calc(100vh - 170px));margin:0 auto}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:2.4%;container-type:inline-size;overflow:hidden;
  background:repeating-linear-gradient(97deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px),repeating-linear-gradient(91deg,rgba(255,255,255,.05) 0 1px,transparent 1px 23px),linear-gradient(160deg,var(--wood2),var(--wood));
  box-shadow:inset 0 0 0 .8cqw #5a3216,0 14px 30px rgba(0,0,0,.28)}
.board.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
.board>div{position:absolute}
.cell{background:var(--birch);box-shadow:inset 0 0 0 .12cqw var(--burn);display:grid;place-items:center;color:var(--burn);font-size:3cqw;line-height:1}
.cell.home{background:color-mix(in srgb,var(--c) 70%,var(--birch))}
.cell.start{background:var(--c);color:#fff;font-size:3.2cqw}
.cell.safe{background:color-mix(in srgb,#fff 45%,var(--birch));font-size:3.4cqw}
.cell.gate{font-size:3.4cqw;animation:gateGlow 3s ease-in-out infinite}
@keyframes gateGlow{50%{color:#b07a12;text-shadow:0 0 1cqw #ffd36b}}
.yard{background:var(--c);border-radius:14%;box-shadow:inset 0 0 0 .4cqw rgba(0,0,0,.2),inset 0 .8cqw 1.6cqw rgba(255,255,255,.18)}
.yard.off,.slot.off{opacity:.35}
.slot{background:var(--birch);border-radius:50%;box-shadow:inset 0 .3cqw .5cqw rgba(0,0,0,.35)}
.jail{border-radius:.8cqw;background:repeating-linear-gradient(90deg,rgba(30,18,8,.75) 0 .35cqw,transparent .35cqw 1.6cqw),rgba(0,0,0,.28);box-shadow:inset 0 0 0 .25cqw rgba(30,18,8,.7)}
.center{background:conic-gradient(from -45deg,var(--p1) 0 90deg,var(--p2) 0 180deg,var(--p3) 0 270deg,var(--p0) 0 360deg);box-shadow:inset 0 0 0 .12cqw var(--burn)}
.hub{border-radius:50%;background:radial-gradient(circle,var(--birch) 52%,#d9bf86 53% 60%,var(--birch) 61%);box-shadow:0 0 0 .35cqw var(--burn),0 .4cqw 1cqw rgba(0,0,0,.35);display:grid;place-items:center;color:var(--burn);font-size:3.6cqw;animation:rot 24s linear infinite}
.pc{position:absolute;width:calc(100% / 15 * .86);aspect-ratio:1;transform:translate(-50%,-50%) scale(var(--sc,1));border-radius:50%;background:#fffaf0;border:.55cqw solid var(--c);box-shadow:0 .35cqw 0 rgba(0,0,0,.35),0 .5cqw 1cqw rgba(0,0,0,.25);transition:left .14s ease,top .14s ease,transform .2s ease;padding:0;display:grid;place-items:center;z-index:5;cursor:default}
.pc img{width:84%;height:84%;object-fit:contain;pointer-events:none}
.pc.plain{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 70%)}
.pc.plain span{color:#fff;font-size:2.6cqw;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pc.can{cursor:pointer;z-index:8;animation:pulse 1s ease-in-out infinite}
.pc.tgt{cursor:crosshair;z-index:8;animation:pulseT .8s ease-in-out infinite}
.pc.hop{animation:hop .18s ease}
@keyframes hop{50%{transform:translate(-50%,-78%) scale(var(--sc,1))}}
@keyframes pulse{50%{box-shadow:0 0 0 .7cqw #fff,0 0 0 1.2cqw var(--c)}}
@keyframes pulseT{50%{box-shadow:0 0 0 .7cqw #fff,0 0 0 1.3cqw #111}}
.pc.jailed{filter:grayscale(.75) brightness(.9)}
.pc.frozen::after{content:"❄";position:absolute;right:-12%;top:-14%;font-size:2.2cqw;background:#dff1ff;color:#1d5a8f;border-radius:50%;width:48%;aspect-ratio:1;display:grid;place-items:center;box-shadow:0 0 0 .2cqw #1d5a8f}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;image-rendering:pixelated}
.banner{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;z-index:45}
.banner span{display:inline-block;font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:clamp(18px,3.4vw,34px);background:var(--c,#2a2925);color:#fff;padding:10px 22px;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.3);animation:bannerIn 2s ease forwards;max-width:92%}
@keyframes bannerIn{0%{opacity:0;transform:translateX(-40%) skewX(-12deg)}15%{opacity:1;transform:translateX(0) skewX(-6deg) scale(1.06)}25%{transform:skewX(-6deg) scale(1)}80%{opacity:1;transform:skewX(-6deg)}100%{opacity:0;transform:translateX(40%) skewX(-12deg)}}
.toast{position:absolute;left:50%;top:3%;transform:translate(-50%,-140%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 16px;max-width:88%;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s ease,opacity .35s;opacity:0;z-index:30;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast b{font-family:Unbounded,Rubik,sans-serif;font-weight:600;display:block;margin-bottom:2px}
.fx{position:absolute;inset:0;display:none;place-items:center;z-index:40;background:rgba(20,12,6,.35);border-radius:2.4%}
.fx.show{display:grid}
.duel{background:var(--panel);color:var(--ink);border-radius:18px;padding:16px 18px 14px;width:min(420px,90%);box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center;animation:popIn .25s ease}
@keyframes popIn{from{transform:scale(.7);opacity:0}}
.duel h3{font-family:Unbounded,Rubik,sans-serif;font-weight:600;font-size:18px;margin:0 0 10px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.side{display:grid;justify-items:center;gap:4px}
.disc{width:62px;height:62px;border-radius:50%;background:#fffaf0;border:4px solid var(--c);display:grid;place-items:center}
.disc img{width:84%;height:84%;object-fit:contain}
.disc.plain{background:var(--c);color:#fff;font-size:24px}
.side .nm2{font-weight:700}
.side .bon{font-size:13px;color:var(--muted);min-height:18px}
.side .tot{font-family:Unbounded,Rubik,sans-serif;font-size:28px;font-weight:800}
.side.win .tot{color:var(--p1)}
.side.lose{opacity:.55}
.side .tot.spin{animation:numSpin .9s steps(9) }
@keyframes numSpin{from{filter:blur(2px)}to{filter:none}}
.mid{font-family:Unbounded,Rubik,sans-serif;color:var(--muted)}
.duel .res{margin:10px 0 0;font-weight:500}
.fate{background:linear-gradient(170deg,#2a2152,#141030);color:#f3eedf;border-radius:18px;padding:22px 22px 18px;width:min(340px,86%);text-align:center;box-shadow:0 0 0 3px #c9a64a,0 20px 50px rgba(0,0,0,.45);animation:fateIn .5s ease}
@keyframes fateIn{from{transform:rotateY(90deg) scale(.8)}}
.fate .k{font-size:13px;color:#c9a64a}
.fate h3{font-family:Unbounded,Rubik,sans-serif;font-weight:600;font-size:20px;margin:6px 0 8px}
.spinBox{background:var(--panel);border-radius:20px;padding:20px;width:min(460px,92%);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.spinBox h3{font-family:Unbounded,Rubik,sans-serif;font-weight:600;margin:0 0 14px}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{padding:14px 10px;border-radius:14px;background:var(--soft);border:3px solid var(--line);font-weight:700;transition:transform .08s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb.hl{border-color:var(--c);background:var(--c);color:#fff;transform:scale(1.07)}
.sb.final{animation:finalP .5s ease 3}
@keyframes finalP{50%{transform:scale(1.15)}}

.reacts{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:thin}
.rb{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:15px}
.rb:hover{border-color:var(--ink);transform:translateY(-1px)}
.rb.emo{font-size:20px;padding:3px 8px}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);animation:floatUp 2.6s ease-out forwards;background:var(--panel);color:var(--ink);border:3px solid var(--c);border-radius:16px;padding:5px 12px;font-weight:700;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.fl small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.fl.emo{font-size:38px;padding:2px 10px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}12%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}22%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-320%) scale(1)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.pls{display:grid;gap:6px}
.plr{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--soft);font-size:14px}
.plr.cur{box-shadow:inset 0 0 0 2px var(--c)}
.plr .dot{width:12px;height:12px;border-radius:50%;flex:none;transition:box-shadow .15s}
.plr.speak .dot{box-shadow:0 0 0 4px #4ade80}
.plr .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plr .sc{margin-left:auto;color:var(--muted);white-space:nowrap;font-size:13px}
.turn{display:flex;align-items:center;gap:10px;font-family:Unbounded,Rubik,sans-serif;font-weight:600;font-size:17px}
.turn i{width:16px;height:16px;border-radius:50%;flex:none}
.season{font-size:14px;color:var(--muted);margin:0}
.diceRow{display:flex;gap:12px;align-items:center}
.die{width:64px;height:64px;flex:none;border-radius:14px;background:#fffaf0;box-shadow:inset 0 0 0 2px #2a2925,0 3px 0 #2a2925;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:2px}
.die i{border-radius:50%;background:transparent}
.die i.on{background:#2a2925}
.die.empty{place-items:center;grid-template:1fr/1fr;color:#8b877c;font-family:Unbounded,sans-serif;font-size:22px}
.die.roll{animation:tumble .5s ease}
@keyframes tumble{30%{transform:rotate(200deg) scale(1.2)}60%{transform:rotate(320deg) scale(.95)}100%{transform:rotate(360deg)}}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{margin:0;color:var(--ink);font-size:15px;min-height:22px;background:var(--soft);padding:8px 10px;border-radius:10px}
.choices{display:flex;flex-wrap:wrap;gap:8px}.choices:empty{display:none}
.panel h2{font-family:Unbounded,Rubik,sans-serif;font-weight:600;font-size:15px;margin:4px 0 0}
.squad{display:grid;gap:8px}
.hero{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:8px;border-radius:12px;background:var(--soft)}
.hero .disc{width:44px;height:44px;border-width:3px}
.hero b{font-weight:700}
.hero p{margin:2px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.hero .stt{font-size:12.5px;margin-top:3px}
.log{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;font-size:13.5px;display:grid;gap:4px}
.log li{padding:3px 0;border-bottom:1px solid var(--line)}
.nm{white-space:nowrap;font-weight:600}
.nm i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:1px}

.tip{position:fixed;right:16px;bottom:16px;max-width:min(360px,calc(100vw - 32px));background:#fff3c4;color:#3a2f00;border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.3);z-index:110;display:none;animation:popIn .3s ease}
.tip.show{display:block}
.tip b{font-family:Unbounded,Rubik,sans-serif;font-weight:600;display:block;margin-bottom:4px}
.tip button{margin-top:8px;background:#3a2f00;color:#fff3c4;border:0;border-radius:10px;padding:6px 12px;cursor:pointer}
.conn{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#2a2925;color:#f8f6f0;padding:10px 16px;border-radius:12px;z-index:115;display:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.conn.show{display:block}

.modal{position:fixed;inset:0;background:rgba(10,14,12,.6);display:none;place-items:center;z-index:100;padding:12px}
.modal.show{display:grid}
.sheet{background:var(--panel);color:var(--ink);border-radius:20px;padding:22px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.sheet h2{font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:24px;margin:0 0 6px;line-height:1.15}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}

/* book */

@keyframes look{0%,100%{transform:translate(0,0)}25%{transform:translate(-22%,8%)}50%{transform:translate(18%,-10%)}75%{transform:translate(6%,16%)}}
@keyframes blinkEye{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.06)}}

const SCALE=[220,261.6,293.7,329.6,392,440,523.3,587.3,659.3];
function musicStart(){const c=actx();if(!c||AU.timer)return;AU.next=c.currentTime+.15;AU.step=0;AU.mel=4;AU.timer=setInterval(musicTick,60)}
function musicTickMasks(){
  const c=AU.ctx,sp=60/72/2;
  while(AU.next<c.currentTime+.25){
    const s=AU.step%64,t=AU.next;
    if(s%32===0){osc('sawtooth',55,t,7,.07,54,AU.mg);osc('sawtooth',58.3,t,7,.06,57,AU.mg)}
    if(s%8===0){osc('sine',58,t,.18,.5,38,AU.mg);osc('sine',52,t+.2,.2,.38,36,AU.mg)}
    if(s===48)osc('sine',196,t,4,.08,196,AU.mg);
    if(Math.random()<.05)noise(t,.25,.05,2000+Math.random()*3000,AU.mg);
    if(Math.random()<.04)osc('sine',[1244,1318,1396,1479][Math.floor(Math.random()*4)],t,1.4,.025,null,AU.mg);
    if(s%16===12&&Math.random()<.5)pluck([110,116.5,123.5,98][Math.floor(Math.random()*4)],t,.25,AU.mg);
    AU.next+=sp;AU.step++;
  }
}

function musicStop(){clearInterval(AU.timer);AU.timer=null}
function musicTick(){
  if(S&&S.mode==='masks'&&UI.screen==='game')return musicTickMasks();
  const c=AU.ctx,sp=60/100/2;
  while(AU.next<c.currentTime+.25){
    const s=AU.step%32,bar=Math.floor(AU.step/32)%4,root=[110,110,98,82.4][bar],t=AU.next;
    if(s%4===0)pluck(root,t,.55,AU.mg);
    if(s%4===2)pluck(root*1.5,t,.32,AU.mg);
    if(s%8===0)osc('sine',90,t,.25,.25,40,AU.mg);
    if(s%8===4)noise(t,.06,.1,6000,AU.mg);
    if(Math.random()<(s%2===0?.62:.3)){AU.mel=Math.max(0,Math.min(SCALE.length-1,AU.mel+pick([-2,-1,-1,0,1,1,2])));pluck(SCALE[AU.mel],t,.3,AU.mg)}
    AU.next+=sp;AU.step++;
  }

const FXC={parts:[],run:false};
function fxSize(){const cv=$('#fxc');if(!cv)return;const b=cv.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,b.width*dpr);cv.height=Math.max(1,b.height*dpr);FXC.u=cv.width/15}
addEventListener('resize',fxSize);
function burst(r,c,colors,n=26,o={}){
  if(REDUCED)return;fxSize();
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.sp||.12)*(.4+Math.random());FXC.parts.push({x:c,y:r,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||.05),g:o.g??.006,life:1,dec:.012+Math.random()*.02,sz:o.sz||(2+Math.floor(Math.random()*3)),col:pick(colors)})}
  fxLoop();
}
function trail(r1,c1,r2,c2,col){if(REDUCED)return;fxSize();for(let i=0;i<=24;i++){const k=i/24;FXC.parts.push({x:c1+(c2-c1)*k,y:r1+(r2-r1)*k,vx:0,vy:0,g:0,life:1+k*.6,dec:.03,sz:3,col})}fxLoop()}
function rain(colors){if(REDUCED)return;fxSize();for(let i=0;i<70;i++)FXC.parts.push({x:Math.random()*15,y:-Math.random()*8,vx:(Math.random()-.5)*.02,vy:.08+Math.random()*.08,g:0,life:1.6,dec:.008,sz:2+Math.floor(Math.random()*2),col:pick(colors)});fxLoop()}
function fxLoop(){if(FXC.run)return;FXC.run=true;requestAnimationFrame(fxFrame)}
function fxFrame(){
  const cv=$('#fxc');if(!cv){FXC.run=false;return}
  const x=cv.getContext('2d'),u=FXC.u||cv.width/15,px=Math.max(2,Math.round(u/10));
  x.clearRect(0,0,cv.width,cv.height);x.imageSmoothingEnabled=false;
  for(const p of FXC.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.dec;const s=px*p.sz/2;x.globalAlpha=Math.max(0,Math.min(1,p.life));x.fillStyle=p.col;x.fillRect(Math.round(p.x*u/px)*px,Math.round(p.y*u/px)*px,s,s)}
  FXC.parts=FXC.parts.filter(p=>p.life>0&&p.y<20);
  if(FXC.parts.length)requestAnimationFrame(fxFrame);else{FXC.run=false;x.clearRect(0,0,cv.width,cv.height)}
}

function skyInit(){
  const cv=$('#sky'),x=cv.getContext('2d');let W,H,stars=[],cons=[],last=0;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.2?4:2,t:Math.random()*6.3,v:.04+Math.random()*.12}));cons=Array.from({length:4},()=>{const cx=Math.random()*W,cy=Math.random()*H;return{pts:Array.from({length:5},()=>[cx+(Math.random()-.5)*240,cy+(Math.random()-.5)*170]),vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.08}})}
  size();addEventListener('resize',size);
  function draw(ts){
    if(ts-last>40){last=ts;const ink=getComputedStyle(document.documentElement).getPropertyValue('--sky').trim()||'#2d4a3f';x.clearRect(0,0,W,H);x.fillStyle=ink;x.strokeStyle=ink;x.lineWidth=1;
      for(const c of cons){c.pts.forEach(p=>{p[0]+=c.vx;p[1]+=c.vy;if(p[0]<-260)p[0]+=W+500;if(p[0]>W+260)p[0]-=W+500;if(p[1]<-200)p[1]+=H+400;if(p[1]>H+200)p[1]-=H+400});x.globalAlpha=.14;x.beginPath();c.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.globalAlpha=.3;c.pts.forEach(p=>x.fillRect(p[0]-2,p[1]-2,4,4))}
      for(const s of stars){s.t+=.05;s.y-=s.v;if(s.y<-5){s.y=H+5;s.x=Math.random()*W}x.globalAlpha=.1+.25*(1+Math.sin(s.t))/2;x.fillRect(Math.round(s.x),Math.round(s.y),s.s,s.s)}}
    if(!REDUCED)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

const QS=new URLSearchParams(location.search);
const FAKE=QS.get('net')==='local';
const NET={peer:null,members:[],pending:[],hostConn:null,code:null,key:null,token:null,closed:false,hb:null,lastHost:0,qs:false,saveT:null,react:{}};
class Emitter{constructor(){this.h={}}on(e,f){(this.h[e]=this.h[e]||[]).push(f);return this}emit(e,...a){(this.h[e]||[]).slice().forEach(f=>{try{f(...a)}catch(err){console.error(err)}})}}
class FakeConn extends Emitter{constructor(p,remote,cid){super();this.p=p;this.peer=remote;this.cid=cid;this.open=false}send(d){if(!this.open)return;this.p.bc.postMessage({k:'d',to:this.peer,from:this.p.id,cid:this.cid,d:JSON.parse(JSON.stringify(d))})}close(){if(!this.open)return;this.open=false;this.p.bc.postMessage({k:'x',to:this.peer,from:this.p.id,cid:this.cid});this.emit('close')}}
class FakePeer extends Emitter{
  constructor(id){super();this.id=id||('p'+uid(8));this.conns={};this.bc=new BroadcastChannel('zz-net');this.bc.onmessage=e=>this.onMsg(e.data);setTimeout(()=>this.emit('open',this.id),40)}
  connect(id){const cid=uid(6),c=new FakeConn(this,id,cid);this.conns[cid]=c;this.bc.postMessage({k:'c',to:id,from:this.id,cid});c._t=setTimeout(()=>{if(!c.open){this.emit('error',{type:'peer-unavailable'});c.emit('close')}},2500);return c}
  onMsg(m){if(!m||m.to!==this.id)return;let c=this.conns[m.cid];
    if(m.k==='c'){c=new FakeConn(this,m.from,m.cid);this.conns[m.cid]=c;c.open=true;this.bc.postMessage({k:'a',to:m.from,from:this.id,cid:m.cid});this.emit('connection',c);setTimeout(()=>c.emit('open'),0)}
    else if(m.k==='a'&&c){clearTimeout(c._t);c.open=true;c.emit('open')}
    else if(m.k==='d'&&c&&c.open)c.emit('data',m.d);
    else if(m.k==='x'&&c&&c.open){c.open=false;c.emit('close')}}
  call(){return null}reconnect(){}destroy(){Object.values(this.conns).forEach(c=>c.close());try{this.bc.close()}catch(e){}}
}

  return id?new window.Peer(id,cfg):new window.Peer(cfg);
}

/* ---------- host ---------- */
function newLobby(code){return{mode:'online',code,key:uid(6),exp:Date.now()+30*60e3,expMin:30,locked:false,goal:2,timer:20,bots:'normal',skin:'wood',started:false,banned:[],bannedNames:[],seats:[{kind:'human',ctrl:'host',name:myName(),online:true,pref:null,dice:store.get('zz_dice','classic')},{kind:'none'},{kind:'none'},{kind:'none'}]}}
function hostCreate(){
  GEN++;const code=uid(6);L=newLobby(code);me={role:'host',ctrl:'host',seat:0};NET.members=[];NET.pending=[];S=null;
  history.replaceState(null,'','?host='+code+(FAKE?'&net=local':''));
  startHostPeer();showScreen('lobby');hostSave();
}
function startHostPeer(){
  try{NET.peer&&NET.peer.destroy()}catch(e){}
  const p=makePeer('zz-'+L.code);NET.peer=p;NET.ready=false;
  p.on('open',()=>{NET.ready=true;connMsg('');renderLobby()});
  p.on('connection',c=>hostOnConn(c));
  p.on('call',c=>voiceOnCall(c));
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  p.on('error',e=>{const t=e&&e.type;if(t==='unavailable-id'){connMsg('Восстанавливаем комнату…');later(startHostPeer,3000)}else if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){connMsg('Нет связи с сервером комнат. Пробуем снова…');later(()=>{try{p.reconnect()}catch(err){startHostPeer()}},3000)}});
  clearInterval(NET.hb);NET.hb=setInterval(hostBeat,4000);
}
function hostBeat(){
  const now=Date.now();
  for(const m of NET.members){if(m.conn&&m.online){try{m.conn.send({t:'ping'})}catch(e){}if(now-(m.seen||0)>15000)memberGone(m)}}
  if(UI.screen==='lobby')renderLobbyTimer();
}
function hostOnConn(conn){
  conn.on('data',d=>{try{hostOnData(conn,d)}catch(e){console.error(e)}});
  conn.on('close',()=>{const m=NET.members.find(x=>x.conn===conn);if(m)memberGone(m);const i=NET.pending.findIndex(x=>x.conn===conn);if(i>=0){NET.pending.splice(i,1);renderLobby()}});
}
function send(conn,msg){try{conn&&conn.send(msg)}catch(e){}}
function memberBySeat(s){return NET.members.find(m=>m.seat===s)}
function memberGone(m){
  if(!m.online)return;m.online=false;m.conn=null;
  const st=L.seats[m.seat];if(st&&st.ctrl===m.token)st.online=false;
  if(S&&S.players[m.seat]&&S.players[m.seat].ctrl===m.token){S.players[m.seat].online=false;log(`${stag(m.seat)} отключился.`);render();if(S.cur===m.seat)scheduleAuto()}
  sendLobby();sendRoster();
}
function hostOnData(conn,d){
  if(!d||typeof d!=='object')return;
  const m=NET.members.find(x=>x.conn===conn);
  if(m)m.seen=Date.now();
  switch(d.t){
    case 'hello':{
      const token=String(d.token||'').slice(0,20),name=cleanName(d.name);
      if(!token)return;
      if(L.banned.includes(token)){send(conn,{t:'reject',why:'Хозяин закрыл тебе вход в эту комнату.'});later(()=>conn.close(),300);return}
      const old=NET.members.find(x=>x.token===token);
      if(old){
        if(old.conn&&old.conn!==conn){try{old.conn.close()}catch(e){}}
        old.conn=conn;old.online=true;old.seen=Date.now();old.peerId=conn.peer;
        const st=L.seats[old.seat];if(st&&st.ctrl===token)st.online=true;
        if(S&&S.players[old.seat]&&S.players[old.seat].ctrl===token){S.players[old.seat].online=true;log(`${stag(old.seat)} вернулся в игру.`)}
        send(conn,{t:'welcome',you:old.seat});sendLobby();sendRoster();if(S){sendStateTo(conn)}
        toastLobby(`${esc(old.name)} вернулся`);return;
      }
      if(L.started){send(conn,{t:'reject',why:'Игра уже идёт. Новые игроки смогут зайти в следующей партии.'});return}
      if(L.locked){send(conn,{t:'reject',why:'Хозяин закрыл вход в комнату.'});return}
      if(d.key!==L.key){send(conn,{t:'reject',why:'Эта ссылка больше не действует. Попроси у хозяина новую.'});return}
      if(Date.now()>L.exp){send(conn,{t:'reject',why:'Срок действия ссылки истёк. Попроси у хозяина новую.'});return}
      if(!L.seats.some(s=>s.kind!=='human')){send(conn,{t:'reject',why:'Комната заполнена.'});return}
      const entry={token,name,conn};
      NET.pending=NET.pending.filter(x=>x.token!==token);NET.pending.push(entry);send(conn,{t:'wait'});sfx('knock');vib([60,60,60]);renderLobby();
      return;
    }
    case 'ping':return;
    case 'pref':if(m&&!L.started&&EL[d.el]){const st=L.seats[m.seat];if(st&&st.ctrl===m.token){st.pref=d.el;sendLobby();renderLobby()}}return;
    case 'dice':if(m&&!L.started&&DICE[d.v]){const st=L.seats[m.seat];if(st&&st.ctrl===m.token){st.dice=d.v;sendLobby();renderLobby()}}return;
    case 'intent':if(m&&S)handleIntent(m.token,d.a);return;
    case 'react':if(m)relayReact(m.seat,d.x,m.token);return;
    case 'voice':if(m){m.voice=!!d.on;sendRoster()}return;
    case 'leave':if(m){if(!L.started){freeSeat(m.seat);NET.members=NET.members.filter(x=>x!==m)}memberGone(m);sendLobby();renderLobby()}return;
  }
}
function acceptMember(e){
  let seat=L.seats.findIndex(s=>s.kind==='none');if(seat<0)seat=L.seats.findIndex(s=>s.kind==='bot');
  if(seat<0){send(e.conn,{t:'reject',why:'Комната заполнена.'});return}

  if(L.started&&S){S.players[s].kind='bot';S.players[s].ctrl='bot';S.players[s].online=true;S.players[s].name=st.name+' 🤖';log(`${stag(s)} удалён из игры. Дальше за него играет бот.`);L.seats[s]={kind:'bot',name:S.players[s].name};render();if(S.cur===s&&(S.phase==='preroll'||S.phase==='rolled'))scheduleAuto()}

function broadcast(msg,exceptToken){if(me.role!=='host')return;for(const m of NET.members)if(m.online&&m.conn&&m.token!==exceptToken)send(m.conn,msg)}
function hostSave(){if(me.role!=='host')return;clearTimeout(NET.saveT);NET.saveT=setTimeout(()=>{store.set('zz_host_'+L.code,{t:Date.now(),L,S,members:NET.members.map(m=>({token:m.token,name:m.name,seat:m.seat}))})},600)}

/* ---------- client ---------- */
function joinRoom(code,key){
  GEN++;me={role:'client',ctrl:null,seat:null};NET.code=code;NET.key=key;NET.closed=false;
  NET.token=store.get('zz_tok_'+code,null)||uid(12);store.set('zz_tok_'+code,NET.token);
  connMsg('Подключаемся к комнате…');
  try{NET.peer&&NET.peer.destroy()}catch(e){}
  const p=makePeer();NET.peer=p;
  p.on('open',()=>clientConnect());
  p.on('call',c=>voiceOnCall(c));
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  p.on('error',e=>{if(e&&e.type==='peer-unavailable'){connMsg('Комната не отвечает: хозяин не в сети. Пробуем снова…');clientRetry()}});
  clearInterval(NET.hb);NET.hb=setInterval(()=>{if(NET.closed)return;if(NET.hostConn&&NET.hostConn.open!==false)send(NET.hostConn,{t:'ping'});if(NET.lastHost&&Date.now()-NET.lastHost>15000){NET.lastHost=0;clientLost()}},4000);
}
function clientConnect(){
  if(NET.closed)return;
  try{NET.hostConn&&NET.hostConn.close()}catch(e){}
  const c=NET.peer.connect('zz-'+NET.code,{reliable:true});NET.hostConn=c;if(!c)return;
  c.on('open',()=>{NET.lastHost=Date.now();send(c,{t:'hello',token:NET.token,name:myName(),key:NET.key})});
  c.on('data',d=>{if(c!==NET.hostConn)return;NET.lastHost=Date.now();try{clientOnData(d)}catch(e){console.error(e)}});
  c.on('close',()=>{if(c===NET.hostConn)clientLost()});
}
function clientLost(){if(NET.closed)return;connMsg('Связь с хозяином потеряна. Переподключаемся…');clientRetry()}
function clientRetry(){clearTimeout(NET.rt);NET.rt=setTimeout(()=>{if(!NET.closed)clientConnect()},3000)}
function clientEnd(text){NET.closed=true;clearInterval(NET.hb);voiceStop();try{NET.peer&&NET.peer.destroy()}catch(e){}connMsg('');GEN++;S=null;L=null;me={role:null};
  openModal(`<h2>Комната недоступна</h2><p class="lead">${text}</p><div class="foot"><button class="btn" id="okHome">На главную</button></div>`);
  $('#okHome').onclick=()=>{closeModal();history.replaceState(null,'',location.pathname+(FAKE?'?net=local':''));showScreen('home')}}
function clientOnData(d){
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case 'welcome':me.seat=d.you;connMsg('');{const dv=store.get('zz_dice','classic');if(DICE[dv])send(NET.hostConn,{t:'dice',v:dv})}break;
    case 'wait':connMsg('Стучимся в комнату. Ждём, пока хозяин впустит тебя…');break;
    case 'lobby':connMsg('');L=d.l;me.seat=d.you;if(!L.started&&UI.screen!=='lobby')showScreen('lobby');else if(UI.screen==='lobby')renderLobby();break;
    case 'state':{const was=S&&S.gid;S=d.s;UI.tEnd=S&&S.tl!=null?Date.now()+S.tl:null;if(!S){if(UI.screen==='game'){closeModal();showScreen('lobby')}break}
      if(UI.screen!=='game'||was!==S.gid)showScreen('game');renderGame();break}
    case 'fx':playFx(d.k,d.d||{});break;
    case 'react':showReact(d.seat,d.x);break;
    case 'roster':NET.roster=d.r||[];voiceSync();renderGameMaybe();break;
    case 'reject':store.del('zz_tok_'+NET.code);clientEnd(esc(d.why||'Вход закрыт.'));break;
    case 'kicked':store.del('zz_tok_'+NET.code);clientEnd('Хозяин удалил тебя из комнаты.');break;
    case 'closed':store.del('zz_tok_'+NET.code);clientEnd('Хозяин закрыл комнату.');break;
  }
}
function clientLeave(){send(NET.hostConn,{t:'leave'});clientEnd('Ты вышел из комнаты. По той же ссылке можно вернуться, пока партия не закончилась.')}

/* ---------- voice ---------- */
const V={stream:null,out:new Map(),inc:new Map(),audio:new Map(),an:new Map(),speak:new Set(),loop:null};
function myPeerId(){return NET.peer&&NET.peer.id}
async function micToggle(){
  if(FAKE){toast('Микрофон','В тестовом режиме голосовой связи нет.');return}
  if(!V.stream){
    try{V.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
    catch(e){openModal(`<h2>Нет доступа к микрофону</h2><p class="lead">Разреши микрофон в настройках браузера для этого сайта и нажми кнопку ещё раз.</p><div class="foot"><button class="btn" onclick="closeModal()">Понятно</button></div>`);return}
    voiceAnalyse('me',V.stream);callAll();
    if(me.role==='client')send(NET.hostConn,{t:'voice',on:true});else sendRoster();
  } else {const tr=V.stream.getAudioTracks()[0];tr.enabled=!tr.enabled}
  micBtn();
}
function micBtn(){const b=$('#bMic');if(!V.stream){b.textContent='🎙️ Микрофон';b.classList.remove('live');return}const on=V.stream.getAudioTracks()[0].enabled;b.textContent=on?'🔴 В эфире':'🔇 Без звука';b.classList.toggle('live',on)}
function rosterList(){if(me.role==='host'){return[{peerId:myPeerId(),seat:0},...NET.members.filter(m=>m.online).map(m=>({peerId:m.peerId,seat:m.seat}))]}return NET.roster||[]}
function sendRoster(){if(me.role!=='host')return;const r=rosterList();broadcast({t:'roster',r});voiceSync()}
function callAll(){if(!V.stream||!NET.peer)return;for(const r of rosterList()){if(!r.peerId||r.peerId===myPeerId())continue;if(V.out.has(r.peerId))continue;const c=NET.peer.call(r.peerId,V.stream);if(c)setupCall(c,true)}}
function voiceSync(){if(V.stream)callAll()}
function voiceOnCall(c){try{c.answer(V.stream||undefined)}catch(e){try{c.answer()}catch(er){}}setupCall(c,false)}
function setupCall(c,out){
  const map=out?V.out:V.inc;const old=map.get(c.peer);if(old&&old!==c){try{old.close()}catch(e){}}
  map.set(c.peer,c);
  c.on('stream',st=>{let a=V.audio.get(c.peer);if(!a){a=new Audio();a.autoplay=true;V.audio.set(c.peer,a)}a.srcObject=st;a.play().catch(()=>{});voiceAnalyse(c.peer,st)});
  c.on('close',()=>{if(map.get(c.peer)===c)map.delete(c.peer)});
}
function voiceAnalyse(id,st){
  const c=actx();if(!c)return;try{const src=c.createMediaStreamSource(st),an=c.createAnalyser();an.fftSize=256;src.connect(an);V.an.set(id,an)}catch(e){}
  if(!V.loop)V.loop=setInterval(()=>{const buf=new Uint8Array(128);let changed=false;for(const [id,an] of V.an){an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));const seat=id==='me'?mySeatForReact():(rosterList().find(r=>r.peerId===id)||{}).seat;if(seat==null)continue;const on=m>14&&!(id==='me'&&V.stream&&!V.stream.getAudioTracks()[0].enabled);if(on!==V.speak.has(seat)){on?V.speak.add(seat):V.speak.delete(seat);changed=true}}if(changed)renderPlayersStrip()},160);
}
function voiceStop(){try{V.stream&&V.stream.getTracks().forEach(t=>t.stop())}catch(e){}V.stream=null;[V.out,V.inc].forEach(m=>{m.forEach(c=>{try{c.close()}catch(e){}});m.clear()});V.audio.forEach(a=>{a.srcObject=null});V.audio.clear();V.an.clear();V.speak.clear();clearInterval(V.loop);V.loop=null;micBtn()}

/* ===================== engine ===================== */
function log(h){S.log.unshift(h);if(S.log.length>60)S.log.pop()}
function render(){renderGame();if(me.role==='host')queueState()}
function coordOf(pc){
  switch(pc.state){
    case 'base':return baseMap(pc.owner,...SLOTS[pc.slot]);
    case 'shards':case 'track':if(pc.p<=G.RM){const [r,c]=G.PATH[absOf(pc)];return [r+.5,c+.5]}{const [r,c]=G.LANES[pc.owner][Math.min(4,pc.p-G.RM-1)];return [r+.5,c+.5]}
    case 'hub':return [7.5,7.5];
    case 'prison':{const i=Math.max(0,prisoners(pc.prisonOf).indexOf(pc));return baseMap(pc.prisonOf,...PRISON[Math.min(i,1)])}
    default:return DONE[pc.owner];
  }
}
function options(o,roll){
  const res=[];
  for(const pc of piecesOf(o)){
    if(pc.freeze>0)continue;const h=pc.hero;
    if(pc.state==='base')res.push({id:pc.id,kind:'exit',label:'Выйти на старт'});
    else if(pc.state==='track'){
      const steps=roll+((S.season==='air'&&heroEl(pc)==='air'&&pc.p<=50)?1:0);
      res.push({id:pc.id,kind:'fwd',steps:Math.min(steps,56-pc.p),label:pc.p+steps>=56?'Зайти домой':`Вперёд на ${steps}`});
      if(pc.p<=50){
        if(GATES.includes(absOf(pc))&&pc.p+26<=50&&(roll<=3||(h==='aquarius'&&abil())))res.push({id:pc.id,kind:'cut',label:'Нырнуть в Колесо'});
        if(h==='cancer'&&abil()&&ready(pc)&&pc.p-roll>=0)res.push({id:pc.id,kind:'back',steps:roll,label:`Назад на ${roll}`});
      }
    } else if(pc.state==='hub')res.push({id:pc.id,kind:'hubexit',dest:Math.min(55,pc.hubExit+roll-1),label:'Выйти из Колеса'});
  }

function scoreOpt(op){
  const pc=P(op.id),hard=S.botLvl==='hard';
  if(op.kind==='exit')return 30;

  const dest=op.kind==='fwd'?pc.p+op.steps:op.kind==='back'?pc.p-op.steps:op.dest,from=op.kind==='hubexit'?pc.hubFrom:pc.p;

function distribute(players){

    const grp=shuffle(act.filter(p=>p.pref===el)),pool=shuffle(Object.keys(HEROES).filter(h=>HEROES[h].el===el));
    if(grp.length===1)grp[0].heroes.push(pool.pop(),pool.pop());else grp.forEach(p=>{if(pool.length)p.heroes.push(pool.pop())});
    grp.forEach(p=>p.heroes.forEach(h=>used.add(h)));
  }

function mScore(op){

  if(PORTALS[a]!=null)s+=(progOf(pc.owner,PORTALS[a])-dest)*.8;
  if(!G.SAFE.has(a)){const foe=S.pieces.find(e=>e.owner!==pc.owner&&onTrack(e)&&absOf(e)===a&&!(e.invis>0));if(foe)s+=28+foe.p*.4+(pc.hero==='geisha'?8:0);s-=(hard?11:7)*threats(pc.owner,a)}else s+=6;
  if(hard)for(let k=pc.p+1;k<=dest;k++){const b=(G.START[pc.owner]+k)%G.N;if(S.traps.some(t=>t.a===b&&t.owner!==pc.owner))s-=12}

}

        for(const pc of piecesOf(p.id)){
          if(S.mode==='masks'&&mCanUse(pc)){abl=true;const d=MACT[pc.hero];add(`${MHEROES[pc.hero].ab}: ${pname(pc)}`,()=>{if(d.self)act({k:'mab',src:pc.id,tgt:pc.id});else{UI.target={kind:'mab',src:pc.id,targets:mTargets(pc).map(e=>e.id)};renderGame()}},true)}
          if(pc.hero==='sagittarius'&&abil()&&ready(pc)&&shootTargets(pc).length){abl=true;add('🏹 Выстрел Стрельца',()=>{UI.target={kind:'shoot',src:pc.id,targets:shootTargets(pc).map(e=>e.id)};renderGame()},true)}
          if(pc.hero==='pisces'&&abil()&&ready(pc)&&swapTargets(pc).length){abl=true;add('🌊 Течение Рыб',()=>{UI.target={kind:'swap',src:pc.id,targets:swapTargets(pc).map(e=>e.id)};renderGame()},true)}
        }
        hint=abl?(S.mode==='masks'?'Способности готовы. Самое время кому-нибудь насолить 😈':HINT.shooter):HINT.my[S.turnId%HINT.my.length];if(abl)tip('ability');
        if(piecesOf(p.id).some(x=>x.state==='prison'))hint+=' '+HINT.prison;
      }
    } else if(S.phase==='rolled'){
      if(virgoAvail(p.id))add('Перебросить (Дева)',()=>act({k:'reroll'}),true);
      if(!S.opts.length){hint=HINT.noMoves;if(virgoAvail(p.id))add('Пропустить ход',()=>act({k:'pass'}))}
      else{
        const cap=S.opts.some(o=>{const pc=P(o.id);if(o.kind!=='fwd'||pc.p+o.steps>G.RM)return false;const a=(G.START[pc.owner]+pc.p+o.steps)%G.N;return !G.SAFE.has(a)&&S.pieces.some(e=>e.owner!==pc.owner&&onTrack(e)&&absOf(e)===a)});
        hint=cap?HINT.capture:HINT.pick;
        if(S.opts.some(o=>o.kind==='cut'))tip('gate');
        tip('preview');
        if(UI.sel!=null){const pc=P(UI.sel);hint=`${pname(pc)}: нажми на кружок или на кнопку, чтобы сходить.`;add('Отмена',()=>{UI.sel=null;renderGame()},true)}
      }
    }
  } else {
    if(p.kind==='bot')hint=`${esc(p.name)} думает… 🤖`;
    else if(!p.online)hint=`${esc(p.name)} не в сети. Скоро за него сыграет автопилот 🤖`;
    else hint=`Ходит ${esc(p.name)}. ${HINT.wait[S.turnId%HINT.wait.length]}`;
  }

  const ch=$('#choices');ch.innerHTML='';

  const sq=me.role==='client'&&me.seat!=null?me.seat:(me.role==='host'?0:S.cur);
  $('#squadTitle').textContent=sq===S.cur&&me.role==='local'?`Отряд: ${pl(sq).name}`:'Мой отряд';
  $('#squad').innerHTML=piecesOf(sq).map(pc=>{const h=pc.hero?HEROES[pc.hero]:null,mh=pc.hero?MHEROES[pc.hero]:null;
    const disc=(h||mh)?`<div class="disc" style="--c:${SEATS[pc.owner].color}"><img src="${ICON(pc.hero)}" alt="" style="object-fit:cover;border-radius:50%;width:100%;height:100%"></div>`:`<div class="disc plain" style="--c:${SEATS[pc.owner].color}">★</div>`;
    const txt=mh?`<b>${mh.name}</b> · ${mh.ab}<p>${mh.d}</p>`:h?`<b>${h.name}</b> · ${EL[h.el].icon} ${h.ab}<p>${h.d}${S.awakened?' <b>Пробуждение:</b> '+h.u:''}</p>`:(S.mode==='masks'?'<b>Безликий</b><p>Пустая маска без способности. Хорош, чтобы ставить капканы и подставляться.</p>':'<b>Странник</b><p>Обычная фишка без способности. Её не жалко подставить.</p>');
    return `<div class="hero">${disc}<div>${txt}<div class="stt">${statusOf(pc)}</div></div></div>`}).join('');
  $('#log').innerHTML=S.log.map(l=>`<li>${l}</li>`).join('');
  renderPieces();
}
function onPieceClick(id){
  if(!S||!canAct())return;
  if(UI.target){if(UI.target.targets.includes(id))act({k:UI.target.kind,src:UI.target.src,tgt:id});return}
  if(S.phase!=='rolled'||!S.opts)return;
  const idx=S.opts.map((o,i)=>o.id===id?i:-1).filter(i=>i>=0);
  if(!idx.length)return;
  if(UI.sel===id&&idx.length===1){act({k:'opt',i:idx[0]});return}
  UI.sel=id;sfx('tick');renderGame();
}

    `<h2>Цель игры</h2><p>Первым завести домой, в центр поля, нужное число фишек: 2 в быстрой партии, 3 в обычной или все 4 в длинной. Длину выбирает хозяин перед началом.</p><h3>Твой отряд</h3><p>Три героя зодиака и Странник, обычная фишка без способности. Героев ты получаешь по любимой стихии: двух из неё и одного из общей колоды.</p><h3>Начало</h3><p>Все фишки сразу стоят на твоём старте (★). Кто ходит первым, решает жребий.</p>`,

  } else {
    acts.innerHTML=`<button class="btn big" id="hHost">Создать комнату</button><button class="btn alt big" id="hLocal">Играть на одном устройстве</button>`;
    $('#homeNote').textContent=onlineOK()?'Комната работает, пока ты в ней. Друзья заходят по твоей ссылке, а ты решаешь, кого впустить.':'Онлайн-комнаты работают, когда игра открыта с сайта (например, GitHub Pages) и есть интернет. На одном устройстве можно играть всегда.';
    $('#hHost').onclick=()=>{if(!onlineOK()){$('#homeErr').textContent='Онлайн-режим здесь недоступен: открой игру через GitHub Pages.';return}saveName();actx();hostCreate()};
    $('#hLocal').onclick=()=>{saveName();actx();GEN++;me={role:'local',ctrl:'local',seat:null};S=null;L={mode:'local',goal:2,timer:0,bots:'normal',skin:'wood',dice:store.get('zz_dice','classic'),started:false,seats:[{kind:'human',name:myName(),pref:null},{kind:'bot',name:BOTNAMES[1]},{kind:'bot',name:BOTNAMES[2]},{kind:'bot',name:BOTNAMES[3]}]};showScreen('lobby')};
  }
}
function elPicker(cur,seat){if(L&&L.gameMode==='masks')return '<p class="note">В режиме «Маски» герои достаются случайно. Сюрприз 😈</p>';return `<div class="els" data-pick="${seat}">${EL_ORDER.map(k=>{const hs=Object.keys(HEROES).filter(h=>HEROES[h].el===k);return `<button class="elb" data-el="${k}" aria-pressed="${cur===k}"><b>${EL[k].icon} ${EL[k].name}</b><span class="ics">${hs.map(h=>`<img src="${ICONS[h]}" alt="${HEROES[h].name}" title="${HEROES[h].name}">`).join('')}</span></button>`}).join('')}</div>`}
function renderLobbyTimer(){const t=$('#expLine');if(!t||!L||me.role!=='host')return;const left=L.exp-Date.now();t.textContent=left>0?`Ссылка действует ещё ${Math.ceil(left/60000)} мин.`:'Срок ссылки истёк: новые игроки не смогут войти. Нажми «Новая ссылка».'}
function toastLobby(text){if(UI.screen==='game')toast('Комната',text)}
function renderLobby(){
  if(UI.screen!=='lobby'||!L)return;
  const host=me.role==='host',local=me.role==='local',client=me.role==='client';
  const active=L.seats.filter(s=>s.kind==='bot'||(s.kind==='human'&&(local||s.online||s.ctrl==='host'))).length;
  let left='',right='';
  const seatRows=L.seats.map((s,i)=>{
    let who,st='',ctl='',pref='';
    if(s.kind==='none'){who='<span style="color:var(--muted)">Свободное место</span>';}
    else{who=esc(s.name||SEATS[i].name);if(s.kind==='bot')st='<span class="st">бот</span>';else if(!local)st=((s.host||s.ctrl==='host')?'<span class="st">👑 хозяин</span>':'')+`<span class="st ${s.online?'on':'off'}">${s.online?'в сети':'не в сети'}</span>`;
      pref=L.gameMode==='masks'?'🎭 маски случайно':s.pref?`${EL[s.pref].icon} ${EL[s.pref].name}`:(s.kind==='bot'?'стихия случайно':'выбирает стихию…')}
    if(local)ctl=`<span class="seg" data-seat-kind="${i}">${[['human','Игрок'],['bot','Бот'],['none','Нет']].map(([k,l])=>`<button data-k="${k}" aria-pressed="${s.kind===k}">${l}</button>`).join('')}</span>`;
    else if(host&&i!==0){
      if(s.kind==='human')ctl=`<button class="x" data-kick="${i}">Удалить</button>`;
      else ctl=`<span class="seg" data-seat-kind="${i}">${[['bot','Бот'],['none','Пусто']].map(([k,l])=>`<button data-k="${k}" aria-pressed="${s.kind===k}">${l}</button>`).join('')}</span>`;
    }
    const mine=client&&i===me.seat?' (это ты)':'';
    return `<div class="seatRow" data-seat="${i}"><i class="dot" style="background:${SEATS[i].color}"></i><span class="who">${who}${mine}</span>${st}<span class="pref">${pref}</span>${ctl}</div>`}).join('');
  const dicePick=cur=>`<div class="skins" data-dicepick>${Object.keys(DICE).map(k=>`<button class="skinb" data-dice="${k}" aria-pressed="${cur===k}"><span class="die d-${k}">${Array.from({length:9},(_,i)=>`<i class="${PIPS[5].includes(i)?'on':''}"></i>`).join('')}</span>${DICE[k]}</button>`).join('')}</div>`;
  const modeSeg=`<h3>Режим</h3><span class="seg" id="modeSeg"><button data-md="zodiac" aria-pressed="${(L.gameMode||'zodiac')==='zodiac'}">♈ Зодиак</button><button data-md="masks" aria-pressed="${L.gameMode==='masks'}">🎭 Маски · хардкор</button></span>`;
  const setts=(host||local)?`${modeSeg}<h3>Таймер хода</h3><span class="seg" id="tmSeg">${(local?[0,15,20,25]:[15,20,25]).map(v=>`<button data-tm="${v}" aria-pressed="${(L.timer||0)===v}">${v?v+' с':'Без таймера'}</button>`).join('')}</span>
    <h3>Боты</h3><span class="seg" id="botSeg">${Object.keys(BOTLV).map(k=>`<button data-bl="${k}" aria-pressed="${(L.bots||'normal')===k}">${BOTLV[k]}</button>`).join('')}</span>
    ${L.gameMode==='masks'?'<p class="note">🎭 У режима «Маски» своё оформление: тьма, кровь и глаза.</p>':`<h3>Поле</h3><div class="skins" id="skinPick">${Object.keys(SKINS).map(k=>`<button class="skinb" data-skin="${k}" aria-pressed="${(L.skin||'wood')===k}"><span class="mini" style="background:${SKINS[k].prev}"></span>${SKINS[k].name}</button>`).join('')}</div>`}
    ${local?`<h3>Кубик</h3>${dicePick(L.dice||'classic')}`:''}`:`<p class="note">Режим: ${L.gameMode==='masks'?'🎭 Маски (хардкор)':'♈ Зодиак'}. Таймер хода: ${L.timer?L.timer+' с':'нет'}. Боты: ${BOTLV[L.bots||'normal']}. Поле: ${SKINS[L.skin||'wood'].name}.</p>`;
  const goal=(host||local)?`<h3>Длина партии</h3><span class="seg" id="goalSeg">${[[2,'Быстрая: 2 фишки'],[3,'Обычная: 3'],[4,'Длинная: 4']].map(([g,l])=>`<button data-g="${g}" aria-pressed="${L.goal===g}">${l}</button>`).join('')}</span>`:`<p class="note">Чтобы победить, нужно завести домой фишек: ${L.goal}.</p>`;
  if(host){
    const link=linkFor(L.code,L.key);
    left=`<div class="card"><h2>Комната ${L.code.toUpperCase()}</h2><p class="lead">${NET.ready?'Комната открыта. Отправь ссылку друзьям.':'Открываем комнату…'}</p>
      <h3>Ссылка-приглашение</h3><div class="linkBox"><input class="in" id="lnk" readonly value="${esc(link)}"><button class="btn" id="cp">Копировать</button></div>
      <p class="note" id="expLine"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px"><span class="seg" id="expSeg">${[10,30,60,180].map(m=>`<button data-m="${m}" aria-pressed="${L.expMin===m}">${m<60?m+' мин':(m/60)+' ч'}</button>`).join('')}</span><button class="btn alt" id="newLink">Новая ссылка</button></div>
      <h3>Вход в комнату</h3><span class="seg" id="lockSeg"><button data-l="0" aria-pressed="${!L.locked}">Открыт, но только с моего разрешения</button><button data-l="1" aria-pressed="${!!L.locked}">Закрыт для всех</button></span>
      ${NET.pending.map((p,i)=>`<div class="knock"><b>🚪 ${esc(p.name)} стучится${L.bannedNames.includes(p.name.toLowerCase())?' ⚠️ ты уже удалял игрока с таким именем':''}</b><button class="btn" data-acc="${i}">Впустить</button><button class="btn alt" data-dec="${i}">Отказать</button></div>`).join('')}
      <p class="note">Без твоего разрешения никто не войдёт. Удалённые игроки больше не попадут в комнату. Новая ссылка отменяет старую, а после начала партии зайти могут только те, кто уже был в комнате.</p></div>`;
  } else if(client){
    left=`<div class="card"><h2>Комната ${esc((L.code||'').toUpperCase())}</h2><p class="lead">Ты в комнате. Выбери стихию и кубик и жди, пока хозяин начнёт игру.</p>${me.seat!=null&&L.seats[me.seat]?`<h3>Твоя стихия</h3>${elPicker(L.seats[me.seat].pref,me.seat)}<h3>Твой кубик</h3>${dicePick(L.seats[me.seat].dice||'classic')}`:''}<div class="wait"><i></i>Ждём хозяина…</div></div>`;
  } else {
    left=`<div class="card"><h2>Игра на одном устройстве</h2><p class="lead">Игроки ходят по очереди, передавая устройство. Каждый выбирает свою стихию.</p>${L.seats.map((s,i)=>s.kind==='human'?`<h3 style="color:${SEATS[i].color}">${esc(s.name||SEATS[i].name)}: стихия</h3>${elPicker(s.pref,i)}`:'').join('')}</div>`;
  }
  if(host&&L.seats[0]){left+=`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Твоя стихия</h3>${elPicker(L.seats[0].pref,0)}<h3>Твой кубик</h3>${dicePick(L.seats[0].dice||'classic')}</div>`}
  right=`<div class="card"><h2>Игроки</h2>${seatRows}${goal}${setts}${(host||local)?`<p class="err" id="lobErr"></p><button class="btn big" id="startBtn" ${active<2?'disabled':''}>Начать игру</button>`:''}${active<2&&(host||local)?'<p class="note">Нужно хотя бы два участника: позови друга или добавь бота.</p>':''}</div>${(host||client)?`<div class="reacts" id="reactsLobby"></div>`:''}`;
  $('#lobby').innerHTML=`<div>${left}</div><div>${right}</div>`;
  renderLobbyTimer();
  if(host||client)bindReacts($('#reactsLobby'));
  const cp=$('#cp');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText($('#lnk').value);cp.textContent='Скопировано ✓'}catch(e){$('#lnk').select()}setTimeout(()=>cp.textContent='Копировать',1500)};
  const es=$('#expSeg');if(es)es.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;L.expMin=+b.dataset.m;L.exp=Date.now()+L.expMin*60e3;sendLobby();renderLobby()};
  const nl=$('#newLink');if(nl)nl.onclick=()=>{L.key=uid(6);L.exp=Date.now()+L.expMin*60e3;hostSave();renderLobby();toast('Ссылка','Старая ссылка больше не работает.')};
  const lk=$('#lockSeg');if(lk)lk.onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;L.locked=b.dataset.l==='1';if(L.locked){NET.pending.forEach(p=>send(p.conn,{t:'reject',why:'Хозяин закрыл вход в комнату.'}));NET.pending=[]}sendLobby();renderLobby()};
  const md=$('#modeSeg');if(md)md.onclick=e=>{const b=e.target.closest('[data-md]');if(!b)return;L.gameMode=b.dataset.md;if(host)sendLobby();renderLobby()};
  const tm=$('#tmSeg');if(tm)tm.onclick=e=>{const b=e.target.closest('[data-tm]');if(!b)return;L.timer=+b.dataset.tm;if(host)sendLobby();renderLobby()};
  const bs=$('#botSeg');if(bs)bs.onclick=e=>{const b=e.target.closest('[data-bl]');if(!b)return;L.bots=b.dataset.bl;if(host)sendLobby();renderLobby()};
  const sk=$('#skinPick');if(sk)sk.onclick=e=>{const b=e.target.closest('[data-skin]');if(!b)return;L.skin=b.dataset.skin;if(host)sendLobby();renderLobby()};
  document.querySelectorAll('[data-dicepick]').forEach(box=>box.onclick=e=>{const b=e.target.closest('[data-dice]');if(!b)return;const v=b.dataset.dice;store.set('zz_dice',v);sfx('dice');
    if(client){send(NET.hostConn,{t:'dice',v});L.seats[me.seat].dice=v}else if(host){L.seats[0].dice=v;sendLobby()}else{L.dice=v;L.seats.forEach(s=>{if(s.kind==='human')s.dice=v})}renderLobby()});
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>acceptMember(NET.pending[+b.dataset.acc]));
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>declineMember(NET.pending[+b.dataset.dec]));
  document.querySelectorAll('#lobby [data-kick]').forEach(b=>b.onclick=()=>{const s=+b.dataset.kick;if(confirm(`Удалить ${L.seats[s].name} из комнаты?`))kickSeat(s)});
  document.querySelectorAll('[data-seat-kind]').forEach(seg=>seg.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const i=+seg.dataset.seatKind,k=b.dataset.k;
    if(local)L.seats[i]={kind:k,name:k==='human'?(i===0?myName():`Игрок ${i+1}`):k==='bot'?BOTNAMES[i]:'',pref:null,dice:L.dice||'classic'};
    else L.seats[i]=k==='bot'?{kind:'bot',name:BOTNAMES[i]}:{kind:'none'};
    if(host)sendLobby();renderLobby()});
  document.querySelectorAll('[data-pick]').forEach(box=>box.onclick=e=>{const b=e.target.closest('[data-el]');if(!b)return;const seat=+box.dataset.pick,el=b.dataset.el;
    if(client){send(NET.hostConn,{t:'pref',el});L.seats[seat].pref=el;renderLobby()}else{L.seats[seat].pref=el;if(host)sendLobby();renderLobby()}});
  const gs=$('#goalSeg');if(gs)gs.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;L.goal=+b.dataset.g;if(host)sendLobby();renderLobby()};
  const sb=$('#startBtn');if(sb)sb.onclick=()=>{if(host){L.seats.forEach((s,i)=>{if(s.kind==='human'&&s.ctrl!=='host'&&!s.online){const m=NET.members.find(x=>x.token===s.ctrl);if(m){NET.members=NET.members.filter(x=>x!==m)}L.seats[i]={kind:'none'}}})}launchGame()};
}

/* ===================== global controls ===================== */
$('#bBook').onclick=()=>{actx();openBook()};
function syncAudioBtns(){$('#bMusic').setAttribute('aria-pressed',AU.music);$('#bSfx').setAttribute('aria-pressed',AU.sfx)}
$('#bMusic').onclick=()=>{AU.music=!AU.music;store.set('zz_music',AU.music);AU.music?musicStart():musicStop();syncAudioBtns()};
$('#bSfx').onclick=()=>{AU.sfx=!AU.sfx;store.set('zz_sfx',AU.sfx);syncAudioBtns();sfx('pop')};
$('#bMic').onclick=micToggle;
$('#bLeave').onclick=()=>{
  if(me.role==='host'){if(confirm('Закрыть комнату? Все игроки будут отключены.'))hostClose()}
  else if(me.role==='client'){if(confirm('Выйти из комнаты? Вернуться можно по той же ссылке, пока партия идёт.'))clientLeave()}
  else{GEN++;S=null;L=null;me={role:null};history.replaceState(null,'',location.pathname+(FAKE?'?net=local':''));showScreen('home')}
};
$('#pls').addEventListener('click',e=>{const b=e.target.closest('[data-kick]');if(!b||me.role!=='host')return;const s=+b.dataset.kick;if(confirm(`Удалить ${S.players[s].name} из игры? Дальше за него будет играть бот.`))kickSeat(s)});
$('#book').addEventListener('click',e=>{if(e.target.id==='book')closeBook()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeBook();if($('#modal').classList.contains('show'))closeModal()}if($('#book').classList.contains('show')){if(e.key==='ArrowRight'){const b=$('#bNext');b&&b.click()}if(e.key==='ArrowLeft'){const b=$('#bPrev');b&&!b.disabled&&b.click()}}});
document.addEventListener('pointerdown',()=>{if(AU.music&&!AU.timer)musicStart()},{once:true});
$('#nameIn').addEventListener('change',e=>store.set('zz_name',cleanName(e.target.value)));

/* ===================== boot ===================== */
skyInit();syncAudioBtns();
(function boot(){
  const hostCode=QS.get('host'),room=QS.get('room');
  if(hostCode&&onlineOK()&&hostResume(hostCode))return;
  if(room&&store.get('zz_tok_'+room,null)&&onlineOK()){showScreen('home');joinRoom(room,QS.get('k'));return}
  showScreen('home');
})();
</script>
</body>
</html>
